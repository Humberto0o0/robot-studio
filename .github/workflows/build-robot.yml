name: Build 3D Robot with Blender

on:
  workflow_dispatch:
  push:
    paths:
      - "blender/**"
      - "app/studio3d.js"
      - "app/performance.mjs"
      - "scripts/render_news_demo.py"
      - "server/render3d.py"
      - "index.html"
      - "studio.html"
      - "tests/smoke3d.cjs"
      - ".github/workflows/build-robot.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blender-robot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Robot Studio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Blender
        run: |
          # GitHub Ubuntu runners normally already have apt indexes. Avoid
          # a full repository refresh unless the cached package lookup fails.
          sudo apt-get install -y --no-install-recommends blender python3-numpy || (
            sudo apt-get update -qq &&
            sudo apt-get install -y --no-install-recommends blender python3-numpy
          )
          blender --version

      - name: Generate editable Blender file and GLB
        run: |
          # Fail the Action when Blender Python raises an exception.
          # Otherwise Blender returns 0 and stale model files get published.
          blender --background --factory-startup --python-exit-code 1 --python blender/build_robot.py | tee /tmp/robot-build.log
          grep -q "ROBOT_BUILD_OK" /tmp/robot-build.log
          ls -lh models/
          test -s models/robot-prototype.blend
          test -s models/robot-prototype.glb

      - name: Test fresh model in mobile browser
        run: |
          mkdir -p /tmp/robot-playwright
          cd /tmp/robot-playwright
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 >/tmp/robot-http.log 2>&1 &
          node tests/performance.test.mjs
          python3 -m unittest discover -s tests -p 'test_performance.py'
          NODE_PATH=/tmp/robot-playwright/node_modules node tests/smoke3d.cjs

      - name: Save grip inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-grip-mobile-inspection
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save downloadable 3D source files
        uses: actions/upload-artifact@v4
        with:
          name: robot-studio-3d-model
          path: |
            models/robot-prototype.blend
            models/robot-prototype.glb
          retention-days: 30

      - name: Commit generated models
        run: |
          git config user.name "robot-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/robot-prototype.glb models/robot-prototype.blend
          git diff --cached --quiet || git commit -m "Build robot 3D assets from Blender script"
          # Other studio edits may arrive while Blender is rendering on the runner.
          # Rebase binary model commit onto latest main instead of force-pushing.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Successfully published fresh Blender model"
              exit 0
            fi
            sleep 4
          done
          echo "Could not publish Blender assets after five retries"
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  render-demo:
    needs: build
    # Render a take on explicit workflow dispatch or a [demo] commit only.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[demo]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: robot-studio-3d-model
          path: models
      - name: Install Blender and diagnostic voice
        timeout-minutes: 8
        run: |
          sudo apt-get install -y --no-install-recommends blender ffmpeg xvfb xauth espeak-ng fonts-dejavu-core python3-venv || (
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq &&
            sudo apt-get install -y --no-install-recommends blender ffmpeg xvfb xauth espeak-ng fonts-dejavu-core python3-venv
          )
          python3 -m venv /tmp/robot-render-venv
          /tmp/robot-render-venv/bin/pip install -r server/requirements.txt
      - name: Render real 3D speaking take
        run: /tmp/robot-render-venv/bin/python scripts/render_news_demo.py
      - name: Verify video and extract review frames
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json demo-output/robot-speaking-demo.mp4 > demo-output/video-info.json
          python3 - <<'PY'
          import json
          d=json.load(open('demo-output/video-info.json'))
          assert any(s['codec_type']=='audio' for s in d['streams'])
          assert any(s.get('width')==360 and s.get('height')==640 for s in d['streams'])
          assert 10<float(d['format']['duration'])<30
          print('PASS actual Blender portrait video with narration',d['format']['duration'])
          PY
          for t in 1 5 9 13; do
            ffmpeg -y -loglevel error -ss "$t" -i demo-output/robot-speaking-demo.mp4 -frames:v 1 "demo-output/frame-$t.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-speaking-demo
          path: demo-output/
          if-no-files-found: ignore
          retention-days: 30

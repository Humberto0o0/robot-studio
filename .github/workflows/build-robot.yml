name: Build 3D Robot with Blender

on:
  workflow_dispatch:
  push:
    paths:
      - "blender/**"
      - ".github/workflows/build-robot.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blender-robot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Robot Studio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Blender
        run: |
          # GitHub Ubuntu runners normally already have apt indexes. Avoid
          # a full repository refresh unless the cached package lookup fails.
          sudo apt-get install -y --no-install-recommends blender python3-numpy || (
            sudo apt-get update -qq &&
            sudo apt-get install -y --no-install-recommends blender python3-numpy
          )
          blender --version

      - name: Generate editable Blender file and GLB
        run: |
          # Fail the Action when Blender Python raises an exception.
          # Otherwise Blender returns 0 and stale model files get published.
          blender --background --factory-startup --python-exit-code 1 --python blender/build_robot.py | tee /tmp/robot-build.log
          grep -q "ROBOT_BUILD_OK" /tmp/robot-build.log
          ls -lh models/
          test -s models/robot-prototype.blend
          test -s models/robot-prototype.glb

      - name: Test fresh model in mobile browser
        run: |
          mkdir -p /tmp/robot-playwright
          cd /tmp/robot-playwright
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8765 >/tmp/robot-http.log 2>&1 &
          NODE_PATH=/tmp/robot-playwright/node_modules node tests/smoke3d.cjs

      - name: Save grip inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-grip-mobile-inspection
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save downloadable 3D source files
        uses: actions/upload-artifact@v4
        with:
          name: robot-studio-3d-model
          path: |
            models/robot-prototype.blend
            models/robot-prototype.glb
          retention-days: 30

      - name: Commit generated models
        run: |
          git config user.name "robot-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/robot-prototype.glb models/robot-prototype.blend
          git diff --cached --quiet || git commit -m "Build robot 3D assets from Blender script"
          # Other studio edits may arrive while Blender is rendering on the runner.
          # Rebase binary model commit onto latest main instead of force-pushing.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Successfully published fresh Blender model"
              exit 0
            fi
            sleep 4
          done
          echo "Could not publish Blender assets after five retries"
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

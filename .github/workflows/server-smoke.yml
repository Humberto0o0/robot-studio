name: Server smoke test

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Build API container
        run: docker build -f server/Dockerfile -t robot-studio-api .
      - name: Start API
        run: |
          docker run -d --name robot-studio-api -p 8080:8080 robot-studio-api
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs robot-studio-api
          exit 1
      - name: Verify capabilities
        run: |
          curl --fail --silent http://127.0.0.1:8080/capabilities | tee /tmp/capabilities.json
          grep -q '"rendering":true' /tmp/capabilities.json
      - name: Container logs
        if: always()
        run: docker logs robot-studio-api || true
